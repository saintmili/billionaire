schema_version: 1
app:
  mode: paper
  timezone: UTC
  log_level: info
storage:
  driver: postgres
  dsn_env: BILLIONAIRE_DATABASE_URL
  timeout: 5s
market_data:
  provider: bybit
  rest_url: https://api.bybit.com
  spot_ws_url: wss://stream.bybit.com/v5/public/spot
  linear_ws_url: wss://stream.bybit.com/v5/public/linear
  stale_after: 60s
  instruments:
    - market: spot
      symbol: BTC/USDT
      timeframes: [1m, 15m]
    - market: linear
      symbol: ETH/USDT
      timeframes: [1m, 15m]
paper:
  initial_balance: "10000"
  quote_currency: USDT

# Captured durably at foreground start; delivery runs outside the financial owner.
notifications:
  targets: [terminal]
  cooldown: 0s
  # Opt in by adding telegram to targets; only environment names belong here.
  telegram:
    token_env: BILLIONAIRE_TELEGRAM_BOT_TOKEN
    chat_id_env: BILLIONAIRE_TELEGRAM_CHAT_ID
